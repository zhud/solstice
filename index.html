function guidance(time){

 }

 if(active){const left=active.time+active.duration-time;prompt.textContent='Keep ringing';prompt.style.color=COLORS[active.dynamic];sub.textContent=(active.dynamic==='p'?'Soft':'Strong')+' · '+(left<1?'prepare to stop':Math.ceil(left)+' seconds left')+(active.time+active.duration===DURATION?' · final strike at 8:11':'');return}

}
function localClock(epoch){return new Date(epoch).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}

}
